global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # Docker DNS returns one A record per replica, so every API/worker
  # container is discovered (and dropped) automatically as you scale.
  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8000
        refresh_interval: 10s

  - job_name: worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9100
        refresh_interval: 10s

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
