name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flash
          POSTGRES_PASSWORD: flash
          POSTGRES_DB: flashsale
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flash" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.1-alpine
        env:
          RABBITMQ_DEFAULT_USER: flash
          RABBITMQ_DEFAULT_PASS: flash
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 10s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://flash:flash@localhost:5432/flashsale
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://flash:flash@localhost:5672/
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.20"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest -q -rA -p no:cacheprovider

  frontend:
    name: Frontend · lint, types, tests, bundle budget
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:size

  infra:
    name: Terraform + shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.1
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
      - name: shellcheck
        run: >-
          docker run --rm -v "$PWD:/mnt:ro" -w /mnt koalaman/shellcheck:v0.10.0 -x
          scripts/deploy.sh scripts/destroy.sh scripts/reset-sale.sh scripts/lib/common.sh loadtest/run.sh

  e2e:
    name: E2E · compose stack, Lighthouse, spike test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Boot the stack exactly as a developer would
        run: docker compose up -d --build --wait
      - name: Smoke test through NGINX
        run: |
          curl -fsS -A "ci-smoke" http://localhost:8080/api/v1/sales/current
          curl -fsS -o /dev/null http://localhost:8080/
      - name: Lighthouse (TTI / LCP / bundle budgets)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./frontend/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
      - name: Spike test + oversell verification
        env:
          USERS: "2000"
          STOCK: "200"
          RATE: "400"
          DURATION: 5s
        run: ./loadtest/run.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200 api worker web migrate
