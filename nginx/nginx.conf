# Main config. The site config is rendered from templates/*.template at
# container start (envsubst), so limits are tunable via environment.
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30s;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # API payloads are tiny; slowloris-style clients are cut off quickly.
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    log_format json escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id","remote":"$remote_addr",'
        '"method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"urt":"$upstream_response_time",'
        '"upstream":"$upstream_addr","cache":"$upstream_cache_status","ua":"$http_user_agent"}';
    # Logs go to stdout -> the Docker log driver. At thousands of req/s a
    # lagging driver fills the pipe and blocks NGINX workers in write(), which
    # stalls every request they hold. NGINX_ACCESS_LOG=errors keeps only 5xx
    # lines on the hot path (see templates/flashsale.conf.template).
    access_log /dev/stdout json buffer=256k flush=2s if=$loggable;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
